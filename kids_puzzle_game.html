<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Match - Fun Puzzle Game!</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
    background: linear-gradient(135deg, #FFE29F 0%, #FFA99F 50%, #FF719A 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    color: #fff;
    font-size: clamp(28px, 6vw, 48px);
    text-shadow: 3px 3px 0px rgba(0,0,0,0.15);
    margin-bottom: 8px;
    text-align: center;
  }

  .subtitle {
    color: #fff;
    font-size: clamp(14px, 3vw, 18px);
    margin-bottom: 20px;
    text-align: center;
    opacity: 0.95;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-box {
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 10px 24px;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: bold;
    color: #FF6B6B;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 420px;
    width: 100%;
  }

  .card {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    perspective: 1000px;
    -webkit-tap-highlight-color: transparent;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card.matched .card-inner {
    transform: rotateY(180deg) scale(0.92);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 8vw, 42px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  .card-front {
    background: linear-gradient(135deg, #6EC6FF 0%, #4A90E2 100%);
    color: white;
    font-size: clamp(24px, 6vw, 32px);
  }

  .card-back {
    background: white;
    transform: rotateY(180deg);
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #B6FFB0, #85E085);
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card:active .card-inner {
    transform: scale(0.95) rotateY(var(--flip, 0deg));
  }

  .win-message {
    display: none;
    margin-top: 24px;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px 30px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }

  .win-message.show {
    display: block;
    animation: bounce-in 0.5s ease;
  }

  @keyframes bounce-in {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .win-message h2 {
    color: #FF6B6B;
    font-size: clamp(22px, 5vw, 30px);
    margin-bottom: 10px;
  }

  .win-message p {
    color: #555;
    margin-bottom: 16px;
    font-size: clamp(14px, 3vw, 18px);
  }

  button {
    font-family: inherit;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: bold;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
    color: #8B3A3A;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  button:active {
    transform: scale(0.95);
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 24px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.3;
    }
  }
</style>
</head>
<body>

<h1>🐾 Animal Match 🐾</h1>
<p class="subtitle">Flip two cards to find matching animal pairs!</p>

<div class="stats">
  <div class="stat-box">⭐ Moves: <span id="moves">0</span></div>
  <div class="stat-box">✅ Matches: <span id="matches">0</span>/8</div>
</div>

<div class="board" id="board"></div>

<div class="win-message" id="winMessage">
  <h2>🎉 You Did It! 🎉</h2>
  <p id="winText">You found all the animals!</p>
  <button onclick="startGame()">Play Again</button>
</div>

<script>
  const emojis = ['🐶','🐱','🐰','🦊','🐼','🦁','🐸','🐵'];
  let cards = [];
  let flippedCards = [];
  let matchedCount = 0;
  let moves = 0;
  let lockBoard = false;

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const matchesEl = document.getElementById('matches');
  const winMessage = document.getElementById('winMessage');
  const winText = document.getElementById('winText');

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startGame() {
    board.innerHTML = '';
    flippedCards = [];
    matchedCount = 0;
    moves = 0;
    lockBoard = false;
    movesEl.textContent = moves;
    matchesEl.textContent = matchedCount;
    winMessage.classList.remove('show');

    const deck = shuffle([...emojis, ...emojis]);

    deck.forEach((emoji, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.dataset.index = index;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">❓</div>
          <div class="card-face card-back">${emoji}</div>
        </div>
      `;

      card.addEventListener('click', () => flipCard(card));
      board.appendChild(card);
    });
  }

  function flipCard(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flippedCards.length === 2) return;

    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [card1, card2] = flippedCards;
    const isMatch = card1.dataset.emoji === card2.dataset.emoji;

    if (isMatch) {
      setTimeout(() => {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedCount++;
        matchesEl.textContent = matchedCount;
        flippedCards = [];

        if (matchedCount === emojis.length) {
          setTimeout(showWin, 400);
        }
      }, 400);
    } else {
      lockBoard = true;
      setTimeout(() => {
        card1.classList.remove('flipped');
        card2.classList.remove('flipped');
        flippedCards = [];
        lockBoard = false;
      }, 900);
    }
  }

  function showWin() {
    winText.textContent = `You found all the animals in ${moves} moves! Great job!`;
    winMessage.classList.add('show');
    launchConfetti();
  }

  function launchConfetti() {
    const emojiSet = ['🎉','🎊','⭐','🌟','🎈'];
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.textContent = emojiSet[Math.floor(Math.random() * emojiSet.length)];
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
      }, i * 60);
    }
  }

  startGame();
</script>

</body>
</html>
